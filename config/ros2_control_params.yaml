/girona500/controller/controller_manager:
  ros__parameters:
    update_rate: 100
    common_controllers:
    - thruster_test_controller
    thruster_test_controller:
      type: forward_command_controller/ForwardCommandController
    imu_broadcaster:
      type: sura_sensors/ImuBroadcaster
    pressure_broadcaster:
      type: sura_sensors/PressureBroadcaster
    dvl75_velocity_broadcaster:
      type: sura_sensors/DvlVelBroadcaster
    dvl75_altitude_broadcaster:
      type: sura_sensors/Dvl75AltitudeBroadcaster
    gps_broadcaster:
      type: sura_sensors/GpsBroadcaster
    auv_controllers:
    - body_force
    - body_velocity
    - position_hold
    - stabilize
    - depth_hold
    body_force:
      type: sura_controllers/auv/BodyForceController
    body_velocity:
      type: sura_controllers/auv/BodyVelocityController
    position_hold:
      type: sura_controllers/auv/PositionHoldController
    stabilize:
      type: sura_controllers/auv/StabilizeController
    depth_hold:
      type: sura_controllers/auv/DepthHoldController
/girona500/controller/thruster_test_controller:
  ros__parameters:
    joints:
    - girona500/base_to_thruster_0
    - girona500/base_to_thruster_1
    - girona500/base_to_thruster_2
    - girona500/base_to_thruster_3
    - girona500/base_to_thruster_4
    interface_name: effort
/girona500/controller/imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: girona500/imu
    topic_name: /girona500/controller/imu_broadcaster/imu
/girona500/controller/pressure_broadcaster:
  ros__parameters:
    sensor_name: pressure_sensor
    frame_id: girona500/pressure
    topic_name: /girona500/sensors/pressure
/girona500/controller/dvl75_velocity_broadcaster:
  ros__parameters:
    sensor_name: dvl_sensor
    frame_id: girona500/dvl
    topic_name: /girona500/sensors/dvl/twist
/girona500/controller/dvl75_altitude_broadcaster:
  ros__parameters:
    sensor_name: dvl_sensor
    frame_id: girona500/dvl_altitude
    topic_name: /girona500/sensors/altitude
/girona500/controller/gps_broadcaster:
  ros__parameters:
    sensor_name: gps_sensor
    frame_id: girona500/gps
    topic_name: /girona500/sensors/gps
/girona500/controller/body_force:
  ros__parameters:
    debug.enabled: true
    base_link: girona500/base_link
    input_topic: /girona500/controller/body_force/command
    output_topic: /girona500/controller/body_force/output
    wrench_output_topic: /girona500/controller/body_force/wrench
/girona500/controller/body_velocity:
