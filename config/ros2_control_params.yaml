    setpoint_topic: /girona500/controller/body_velocity/setpoint
    navigator_topic: /girona500/navigator/navigation
    feedforward_topic: /girona500/controller/depth_hold/feedforward
    output_topic: /girona500/controller/body_velocity/output
    pid_terms_topic: /girona500/controller/body_velocity/pid_terms
    body_force_controller_name: body_force
    kp_x: 30.0
    ki_x: 6.0
    kd_x: 0.0
    antiwindup_x: 1.0
    kp_y: 30.0
    ki_y: 6.0
    kd_y: 0.0
    antiwindup_y: 1.0
    kp_z: 80.0
    ki_z: 20.0
    kd_z: 0.0
    antiwindup_z: 1.0
    kp_roll: 0.2
    ki_roll: 1.0
    kd_roll: 0.0
    antiwindup_roll: 1.0
    kp_pitch: 0.2
    ki_pitch: 1.0
    kd_pitch: 0.0
    antiwindup_pitch: 1.0
    kp_yaw: 1.0
    ki_yaw: 0.0
    kd_yaw: 0.0
    antiwindup_yaw: 1.0
